<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยืนยันคำสั่งซื้อ — Glow &amp; Soft</title>
  <meta name="description" content="กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อสินค้า Glow & Soft">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">Glow &amp; Soft</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container container--narrow stack">
        <h1 class="h1">ยืนยันคำสั่งซื้อ</h1>
        <p class="lead">กรอกข้อมูลให้ครบถ้วน ทีมงานจะติดต่อกลับเพื่อยืนยันรายละเอียดการจัดส่ง</p>

        <form id="orderForm" class="stack" novalidate>
          <div class="field">
            <label class="field__label" for="customerName">ชื่อลูกค้า</label>
            <input class="field__input" type="text" id="customerName" name="customerName" required>
          </div>

          <div class="field">
            <label class="field__label" for="contact">เบอร์โทร/Line</label>
            <input class="field__input" type="text" id="contact" name="contact" required>
          </div>

          <div class="field">
            <label class="field__label" for="items">รายการสินค้า</label>
            <textarea class="field__input" id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label class="field__label" for="total">จำนวนเงินรวม (บาท)</label>
            <input class="field__input" type="text" id="total" name="total" required>
          </div>

          <div class="field">
            <label class="field__label" for="note">หมายเหตุ</label>
            <textarea class="field__input" id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--primary">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Glow &amp; Soft</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
